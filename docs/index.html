<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Shakuhachi Music</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #d4c9b5;
      --ink: #1a1714;
      --muted: #453b30;
      --rule: #8d8374;
      --bamboo: #38523d;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "Hiragino Mincho ProN", Georgia, serif;
      font-size: 1.05rem;
      line-height: 1.65;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4.5rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.2;
    }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    nav li {
      border-top: 1px solid var(--rule);
    }
    nav li:last-child { border-bottom: 1px solid var(--rule); }
    nav a {
      display: block;
      padding: 0.9rem 0;
      color: var(--bamboo);
      text-decoration: none;
    }
    address { font-style: normal; }
    @media (min-width: 800px) {
      main { padding-top: 3.5rem; }
      h1 { font-size: 2.35rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Shakuhachi Music</h1>
    <p>Legal information for Shakuhachi Music.</p>
    <nav aria-label="Legal">
      <ul>
        <li><a href="privacy.html">Privacy Policy</a></li>
        <li><a href="terms.html">Terms of Use</a></li>
        <li><a href="mailto:lj.app.support@gmail.com">Support</a></li>
      </ul>
    </nav>
    <p><address><a href="mailto:lj.app.support@gmail.com">lj.app.support@gmail.com</a></address></p>
  </main>
</body>
</html>
